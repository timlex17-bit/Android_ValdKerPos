plugins {
    alias(libs.plugins.android.application)
}

// Kredensial signing dibaca dari keystore.properties yang di-gitignore.
// Kalau file itu tidak ada (mesin dev / CI tanpa rahasia), build release tetap
// jalan tapi menghasilkan APK unsigned seperti sebelumnya - tidak ada yang rusak.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// URL backend per build type. Default menjaga perilaku lama; override lewat
// gradle.properties atau -PdebugBaseUrl=... tanpa menyentuh kode.
def debugBaseUrl = project.findProperty("debugBaseUrl") ?: "https://api.valdker.web.id/api/"
def releaseBaseUrl = project.findProperty("releaseBaseUrl") ?: "https://api.valdker.web.id/api/"

android {
    namespace 'com.valdker.pos'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.valdker.pos"

        // Skema Room diekspor supaya migrasi bisa ditulis dari skema yang
        // benar-benar diharapkan Room, dan bisa diuji, bukan ditebak.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        minSdk 24
        targetSdk 36
        // Dinaikkan manual tiap rilis; Play menolak upload dengan versionCode
        // yang sudah dipakai. versionName mengikuti semver rilis.
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"${debugBaseUrl}\""
        }

        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties tidak ditemukan - APK release TIDAK akan ditandatangani.")
            }

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "BASE_URL", "\"${releaseBaseUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "androidx.annotation:annotation:1.7.1"
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.3.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
